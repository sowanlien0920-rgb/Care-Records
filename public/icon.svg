<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    ホーム画面用のアイコン。ヘッダーの .brand .logo（🏠 を角丸の四角に載せたもの、
    styles.css:44-47）と同じ見え方にしてある。色は styles.css の --brand / --brand2。
    PNG はこの SVG から scripts/renderIcons.ts が書き出す。手で描き直さないこと。
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6fe0"/>
      <stop offset="1" stop-color="#22a7e8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 246 L256 140 L384 246"/>
    <path d="M166 232 V372 H346 V232"/>
    <path d="M222 372 V300 H290 V372"/>
  </g>
</svg>
